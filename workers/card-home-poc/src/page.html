<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hundred カードホーム検証</title>
<style>body{font:16px system-ui;background:#101923;color:#e4edf5;margin:32px auto;max-width:1100px;padding:0 20px}h1{font-size:26px}main{display:grid;grid-template-columns:2fr 1fr;gap:24px}section{background:#203142;padding:20px;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #405264}input,button,select{font:inherit;padding:8px;border-radius:5px}input[type=number]{width:52px}input[type=text],select{box-sizing:border-box;width:100%;margin:8px 0}button{cursor:pointer;background:#b6dbef;border:0;margin:8px 4px 8px 0}button:disabled{opacity:.4;cursor:default}#status{min-height:48px;color:#ffe1a0;white-space:pre-wrap}small{color:#bed0db}#deckId{font-family:monospace} @media(max-width:750px){main{display:block}section{margin-bottom:20px}}</style>
<h1>HUNDRED / ホーム・デッキ保存検証</h1><p id="masterInfo">マスタ読込中…</p>
<main><section><h2>カードマスタからデッキを組む</h2><p>40枚・同名最大3枚。今回のカードはすべて効果なしです。</p><table><thead><tr><th>カード</th><th>属性 / コスト</th><th>枚数</th></tr></thead><tbody id="cards"></tbody></table></section>
<section><h2>デッキ</h2><label>保存済みデッキ<select id="saved"></select></label><button id="load">選択デッキを読み込む</button><label>新規保存する名前<input id="name" type="text" value="検証デッキ" maxlength="80"></label><p id="count">0 / 40枚</p><button id="save" disabled>新しいデッキIDで保存</button><p>保存後の内容は固定されます。変更して保存すると別のIDになります。</p><label>保存済みデッキID<input id="deckId" type="text" readonly></label><button id="copy" disabled>IDをコピー</button><p id="status" role="status"></p><small>保存済みIDをUnityのロビーへ入力してください。未保存の変更は対戦へ反映されません。プレイヤー認証・所持カード制限は今回の対象外です。</small></section></main>
<script type="module">
let master, decks=[], amounts=new Map(), saving=false;
const el=id=>document.getElementById(id);
const errors={deck_must_have_40_cards:'デッキは40枚にしてください。',same_name_limit:'同名カードは3枚までです。',invalid_deck_entry:'カード枚数を確認してください。',invalid_deck_name:'デッキ名を入力してください。',master_not_found:'マスタがありません。npm run setup を実行してください。',home_data_error:'D1の初期化・登録データを確認してください。'};
async function api(path,options){const r=await fetch(path,options);const v=await r.json();if(!r.ok)throw new Error(errors[v.error]||v.error);return v;}
function report(e){el('status').textContent=e.message||e;}
function update(){let total=0;for(const n of amounts.values())total+=n;el('count').textContent=total+' / 40枚';el('save').disabled=saving||total!==40;}
function draw(){el('cards').replaceChildren();for(const c of master.cards){const row=document.createElement('tr');const name=document.createElement('td');name.textContent=c.name+' ('+c.cardId+')';const cost=document.createElement('td');cost.textContent=c.color+' / '+c.cost;const cell=document.createElement('td');const input=document.createElement('input');input.type='number';input.min='0';input.max='3';input.step='1';input.value=amounts.get(c.cardId)||0;input.setAttribute('aria-label',c.name+'の枚数');input.oninput=()=>{const n=Number(input.value);amounts.set(c.cardId,Number.isInteger(n)?Math.max(0,Math.min(3,n)):0);input.value=amounts.get(c.cardId);update();};cell.append(input);row.append(name,cost,cell);el('cards').append(row);}update();}
async function refresh(){decks=(await api('/api/decks')).decks;el('saved').replaceChildren();for(const d of decks.filter(d=>d.masterVersion===master.masterVersion)){const o=document.createElement('option');o.value=d.deckId;o.textContent=d.name+' / '+d.deckId;el('saved').append(o);}}
function setId(id){el('deckId').value=id;el('copy').disabled=!id;}
el('load').onclick=()=>{const d=decks.find(d=>d.deckId===el('saved').value);if(!d)return;amounts=new Map(d.cards.map(c=>[c.cardId,c.count]));el('name').value=d.name;setId(d.deckId);draw();report('保存デッキを読み込みました。');};
el('save').onclick=async()=>{saving=true;update();try{const cards=[...amounts].filter(([,n])=>n>0).map(([cardId,count])=>({cardId,count}));const d=await api('/api/decks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('name').value,masterVersion:master.masterVersion,cards})});setId(d.deckId);report('D1へ保存しました。このIDをUnityのロビーへ入力してください。');await refresh();el('saved').value=d.deckId;}catch(e){report(e);}finally{saving=false;update();}};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('deckId').value);report('デッキIDをコピーしました。');}catch{el('deckId').select();report('ID欄を選択しました。手動でコピーしてください。');}};
try{master=await api('/api/master');el('masterInfo').textContent='公開マスタ '+master.masterVersion+' / '+master.cards.length+'種類 / ルール '+master.rulesVersion;draw();await refresh();if(el('saved').options.length)el('load').click();}catch(e){report(e);}
</script></html>
